<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Painel Administrativo - SEGMAF</title>
<link rel="icon" type="image/x-icon" href="favicon.ico?v=2" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f4f6f9;color:#0A2540;min-height:100vh}
header{background:#0A2540;color:#fff;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
header h1{font-size:1.15rem;font-weight:600}
header a{color:#fff;text-decoration:none;font-size:.9rem;border:1px solid rgba(255,255,255,.5);padding:6px 12px;border-radius:6px}
main{max-width:1100px;margin:0 auto;padding:24px}
.card{background:#fff;border:1px solid #e3e8ef;border-radius:10px;padding:24px;box-shadow:0 1px 3px rgba(10,37,64,.06)}
.hidden{display:none}
label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px}
input[type=password]{width:100%;max-width:360px;padding:10px 12px;border:1px solid #c9d3df;border-radius:8px;font-size:1rem}
button{cursor:pointer;border:none;border-radius:8px;font-weight:600}
.btn-primary{background:#F26522;color:#fff;padding:10px 22px;font-size:.95rem}
.btn-primary:hover{background:#d8540f}
.btn-danger{background:#dc2626;color:#fff;padding:6px 12px;font-size:.8rem}
.btn-outline{background:#fff;color:#0A2540;border:1px solid #c9d3df;padding:8px 16px;font-size:.85rem}
.btn-outline:hover{background:#eef2f7}
.mensagem{margin-top:12px;font-size:.9rem}.mensagem.erro{color:#dc2626}.mensagem.ok{color:#15803d}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #e9edf3;vertical-align:top}
th{background:#0A2540;color:#fff;font-weight:600;white-space:nowrap}tr:hover td{background:#f7fafc}
td.nome{font-weight:600}.tag{background:#eef2f7;color:#0A2540;border-radius:20px;padding:2px 10px;font-size:.75rem}
.mensagem-texto{max-width:340px;white-space:pre-wrap;color:#475569}.badge-total{background:#F26522;color:#fff;border-radius:20px;padding:2px 10px;font-size:.8rem}
.centro{max-width:420px;margin:10vh auto}.rodape{text-align:center;font-size:.75rem;color:#94a3b8;margin:32px 0}
.vazio{color:#64748b;text-align:center;padding:32px;font-size:.9rem}.acoes-linha{display:flex;gap:8px;justify-content:flex-end}
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:8px}
.img-item{border:1px solid #e3e8ef;border-radius:10px;padding:12px;background:#fafbfc}
.img-item img{width:100%;height:110px;object-fit:cover;border-radius:8px;background:#eef2f7}
.img-item .nome-img{font-weight:600;font-size:.85rem;margin:8px 0 2px;color:#0A2540}.img-item .info-img{font-size:.75rem;color:#64748b;margin-bottom:8px}
.img-item .acoes-img{display:flex;gap:8px;flex-wrap:wrap}.verde{color:#15803d;font-weight:600}
.galeria-wrap{margin-top:24px}.galeria-titulo{font-size:1.05rem;font-weight:700;color:#F26522;margin-bottom:12px;text-align:center;letter-spacing:1px}
.carrossel{position:relative;max-width:820px;margin:0 auto}.carrossel-viewport{overflow:hidden;border-radius:10px;background:#0A2540}
.carrossel-track{display:flex;transition:transform .45s ease}.carrossel-slide{min-width:100%;height:430px;display:flex;align-items:center;justify-content:center;background:#0A2540}
.carrossel-slide img{width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in}
.carrossel-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(10,37,64,.55);color:#fff;border:none;width:40px;height:40px;border-radius:50%;font-size:1.2rem;cursor:pointer;z-index:2}
.carrossel-btn:hover{background:#F26522}.carrossel-btn.ant{left:10px}.carrossel-btn.prox{right:10px}
.carrossel-dots{text-align:center;margin-top:10px}.carrossel-dots .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#c9d3df;margin:0 4px;cursor:pointer;border:none;padding:0}
.carrossel-dots .dot.ativo{background:#F26522}.carrossel-contador{text-align:center;font-size:.8rem;color:#64748b;margin-top:6px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:100}.lightbox.aberto{display:flex}
.lightbox img{max-width:92vw;max-height:92vh;object-fit:contain;border-radius:6px}.lightbox-close{position:absolute;top:16px;right:24px;color:#fff;font-size:2rem;cursor:pointer;background:none;border:none}
@media(max-width:700px){table{font-size:.78rem}th,td{padding:8px}.mensagem-texto{max-width:220px}.carrossel-slide{height:260px}}
</style>
</head>
<body>
<header><h1>SEGMAF Solu&ccedil;&otilde;es em Limpeza Ltda</h1><a href="index.html">&#8592; Ver site</a></header>
<main>
  <div class="galeria-wrap">
    <div class="galeria-titulo">GALERIA DE FOTOS</div>
    <div class="carrossel">
      <button class="carrossel-btn ant" id="btnAnt" aria-label="Anterior">&#10094;</button>
      <div class="carrossel-viewport"><div class="carrossel-track" id="trackGaleria"></div></div>
      <button class="carrossel-btn prox" id="btnProx" aria-label="Pr&oacute;ximo">&#10095;</button>
      <div class="carrossel-dots" id="dotsGaleria"></div><div class="carrossel-contador" id="contadorGaleria"></div>
    </div>
  </div>
  <div id="telaLogin" class="card centro">
    <h2 style="font-size:1.1rem;margin-bottom:16px">Entrar no painel</h2>
    <label for="campoSenha">Senha do usu&aacute;rio segmaf@outlook.com</label>
    <input type="password" id="campoSenha" placeholder="Digite a senha do Supabase" autocomplete="current-password" />
    <div id="captchaAdmin" style="width:100%;min-height:65px;margin-top:14px"></div>
    <div class="mensagem" id="msgLogin"></div>
    <div style="margin-top:16px"><button class="btn-primary" id="btnEntrar" style="width:100%">Entrar</button></div>
  </div>
  <div id="telaPainel" class="hidden">
    <div class="card" style="padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
      <div style="font-size:1rem;font-weight:600">Solicita&ccedil;&otilde;es de or&ccedil;amento <span class="badge-total" id="totalBadge">0</span></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn-outline" id="btnAtualizar">&#8635; Atualizar</button><button class="btn-outline" id="btnAjustar">&#9998; Ajustar Atendidos</button>
        <button class="btn-outline" id="btnZerar">&#8634; Zerar Atendidos</button><button class="btn-outline" id="btnExportar">&#11015; Exportar CSV</button><button class="btn-outline" id="btnSair">Sair</button>
      </div>
    </div>
    <div class="mensagem hidden" id="msgPainel"></div>
    <div class="card" style="margin-top:16px;overflow-x:auto"><div id="tabela"></div></div>
    <div class="card" style="margin-top:16px">
      <div style="font-size:1rem;font-weight:600">Imagens dos Cards - In&iacute;cio do Site</div>
      <p style="font-size:.85rem;color:#64748b;margin:4px 0 8px">Troque as imagens dos cards e do carrossel. Envie JPG, PNG ou WebP de at&eacute; 3 MB.</p>
      <div class="img-grid" id="gradeImagens"></div><div class="mensagem" id="msgImagens"></div>
    </div>
  </div>
</main>
<p class="rodape">SEGMAF Solu&ccedil;&otilde;es em Limpeza LTDA &mdash; CNPJ 54.851.014/0001-48</p>
<div class="lightbox" id="lightbox"><button class="lightbox-close" id="lbFechar">&times;</button><img id="lbImagem" alt="Foto da galeria" /></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
<script src="supabase-client.js"></script>
<script src="admin-supabase.js"></script>
</body>
</html>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1400" viewBox="0 0 900 1400" role="img" aria-labelledby="title desc">
  <title id="title">Painel solar vertical realista</title>
  <desc id="desc">Painel fotovoltaico vetorial na vertical, com vidro preto, células detalhadas e moldura metálica fina, sem estrutura de sustentação.</desc>

  <defs>
    <!-- Aluminum frame -->
    <linearGradient id="aluminum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".08" stop-color="#b8c1c8"/>
      <stop offset=".18" stop-color="#f2f5f7"/>
      <stop offset=".42" stop-color="#78858e"/>
      <stop offset=".63" stop-color="#e8ecef"/>
      <stop offset=".82" stop-color="#66737c"/>
      <stop offset="1" stop-color="#dfe5e9"/>
    </linearGradient>
    <linearGradient id="bevelTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#c8d0d5"/>
      <stop offset="1" stop-color="#6d7982"/>
    </linearGradient>
    <linearGradient id="bevelSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f2a31"/>
      <stop offset=".35" stop-color="#7e8a92"/>
      <stop offset=".7" stop-color="#d8dfe3"/>
      <stop offset="1" stop-color="#4c5962"/>
    </linearGradient>

    <!-- Black photovoltaic glass -->
    <linearGradient id="blackGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a20"/>
      <stop offset=".22" stop-color="#020609"/>
      <stop offset=".52" stop-color="#0a1116"/>
      <stop offset=".78" stop-color="#000204"/>
      <stop offset="1" stop-color="#121b21"/>
    </linearGradient>
    <radialGradient id="cellBlack" cx=".28" cy=".18" r=".95">
      <stop offset="0" stop-color="#26343c"/>
      <stop offset=".28" stop-color="#111a20"/>
      <stop offset=".72" stop-color="#030608"/>
      <stop offset="1" stop-color="#172229"/>
    </radialGradient>
    <linearGradient id="glassReflection" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset=".22" stop-color="#d9f3ff" stop-opacity=".08"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".86" stop-color="#cdefff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".16"/>
    </linearGradient>

    <!-- One detailed photovoltaic cell, repeated in a 6 × 12 grid -->
    <pattern id="cells" width="110" height="96" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="104" height="90" rx="2" fill="url(#cellBlack)"/>
      <path d="M55 5V91" stroke="#a5b4bd" stroke-width="1.4" opacity=".52"/>
      <path d="M5 25H105M5 48H105M5 71H105" stroke="#8c9da7" stroke-width=".65" opacity=".24"/>
      <path d="M10 7L100 88M34 5L107 70M3 27L76 93" stroke="#d4e0e6" stroke-width=".45" opacity=".08"/>
      <circle cx="21" cy="19" r="1" fill="#dce9ee" opacity=".2"/>
      <circle cx="84" cy="64" r=".8" fill="#dce9ee" opacity=".16"/>
      <path d="M5 5H105" stroke="#dce7ed" stroke-width="1.2" opacity=".14"/>
      <path d="M3 93H107" stroke="#000000" stroke-width="2" opacity=".6"/>
    </pattern>

    <clipPath id="glassClip">
      <rect x="120" y="112" width="660" height="1152" rx="5"/>
    </clipPath>

    <filter id="objectShadow" x="-25%" y="-20%" width="160%" height="165%">
      <feDropShadow dx="14" dy="20" stdDeviation="18" flood-color="#00070c" flood-opacity=".38"/>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Complete panel body; transparent canvas around it -->
  <g filter="url(#objectShadow)">
    <!-- Thin physical depth, without any support structure -->
    <path d="M96 84H810L822 96V1292L810 1304H96L84 1292V96Z"
          fill="#253039" stroke="#11191f" stroke-width="4"/>

    <!-- Outer metallic frame -->
    <rect x="88" y="76" width="724" height="1224" rx="14"
          fill="url(#aluminum)" stroke="#53616a" stroke-width="4"/>

    <!-- Four realistic bevel rails -->
    <path d="M103 91H797L780 112H120Z" fill="url(#bevelTop)"/>
    <path d="M103 1285H797L780 1264H120Z" fill="#66737c"/>
    <path d="M103 91L120 112V1264L103 1285Z" fill="url(#bevelSide)"/>
    <path d="M797 91L780 112V1264L797 1285Z" fill="#8e9aa2"/>

    <!-- Black glass base -->
    <rect x="120" y="112" width="660" height="1152" rx="5"
          fill="url(#blackGlass)" stroke="#05090c" stroke-width="8"/>

    <!-- 72 photovoltaic cells -->
    <g clip-path="url(#glassClip)">
      <rect x="120" y="112" width="660" height="1152" fill="url(#cells)"/>

      <!-- Main silver busbars -->
      <g stroke="#c3cdd3" opacity=".58">
        <path d="M230 112V1264M340 112V1264M450 112V1264M560 112V1264M670 112V1264"
              stroke-width="3"/>
        <path d="M120 208H780M120 304H780M120 400H780M120 496H780M120 592H780M120 688H780M120 784H780M120 880H780M120 976H780M120 1072H780M120 1168H780"
              stroke-width="2.5"/>
      </g>

      <!-- Tempered glass reflection -->
      <path d="M60 140L330 95L735 1265L470 1300Z" fill="url(#glassReflection)" opacity=".5"/>
      <path d="M560 88L700 92L820 640L752 705Z" fill="#e8f8ff" opacity=".045"/>

      <!-- Subtle dark edge falloff -->
      <rect x="120" y="112" width="660" height="1152" rx="5"
            fill="none" stroke="#000000" stroke-width="28" opacity=".28"/>
    </g>

    <!-- Inner metallic lip and highlights -->
    <rect x="114" y="106" width="672" height="1164" rx="7"
          fill="none" stroke="#d8e0e5" stroke-width="4" opacity=".82"/>
    <path d="M121 114H778" stroke="#ffffff" stroke-width="5" opacity=".54"/>
    <path d="M121 1262H778" stroke="#26343c" stroke-width="5" opacity=".72"/>
    <path d="M122 114V1260" stroke="#ffffff" stroke-width="3" opacity=".36"/>

    <!-- Corner fasteners -->
    <g fill="#e8edf0" stroke="#53616a" stroke-width="2.5">
      <circle cx="105" cy="94" r="4"/>
      <circle cx="795" cy="94" r="4"/>
      <circle cx="105" cy="1282" r="4"/>
      <circle cx="795" cy="1282" r="4"/>
    </g>

    <!-- Small glass glints -->
    <path d="M164 146L348 146" stroke="#ffffff" stroke-width="5" opacity=".18" stroke-linecap="round" filter="url(#innerGlow)"/>
    <path d="M714 1186L748 1152" stroke="#ffffff" stroke-width="3" opacity=".16" stroke-linecap="round"/>
  </g>
</svg>
